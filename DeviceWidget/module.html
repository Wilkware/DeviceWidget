<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <style>
        :root {
            --margin-top: 60px;
            --margin-side: 20px;
            --margin-bottom: 15px;
            --tilecolor: transparent;
            --tiletrans: 100%;
            --imagesize: 40%;
            --statecolor: var(--content-color);
            --statefont: 14px;
            --actionfont: 14px;
            --progressstart: #28CDAB;
            --progressstop: #208A74;
            --progressvalue: 0%;
            --offlinecolor: #E53935;
            --progressfont: 14px;
            --info1font: 12px;
            --info2font: 12px;
            --info3font: 12px;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            box-sizing: border-box;
            background: color-mix(in srgb, var(--tilecolor) var(--tiletrans), transparent);
        }

        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }

        /* Container mit 2 Spalten */
        #container {
            margin: var(--margin-top) var(--margin-side) var(--margin-bottom) var(--margin-side);
            display: flex;
            height: calc(100% - var(--margin-top) - var(--margin-bottom));
        }

        /* Verhältnis-Klassen */
        .ratio-20 #left {
            flex: 0 0 20%;
        }

        .ratio-20 #right {
            flex: 0 0 80%;
        }

        .ratio-30 #left {
            flex: 0 0 30%;
        }

        .ratio-30 #right {
            flex: 0 0 70%;
        }

        .ratio-40 #left {
            flex: 0 0 40%;
        }

        .ratio-40 #right {
            flex: 0 0 60%;
        }

        .ratio-50 #left {
            flex: 0 0 50%;
        }

        .ratio-50 #right {
            flex: 0 0 50%;
        }

        /* Linke Spalte */
        #left {
            display: flex;
            padding-right: 15px;
            border-right: 1px dotted var(--accent-color);
        }

        #left img {
            max-height: 100%;
            max-width: 100%;
            margin: auto;
        }

        /* Rechte Spalte */
        #right {
            display: flex;
            padding-left: 15px;
            flex-direction: column;
            justify-content: flex-start;
            position: relative;
        }

        #switch {
            position: absolute;
            right: 0%;
            top: 0%;
            z-index: 10;
            /* über alles andere legen */
        }

        /* Offline-Badge (anstelle des Schalters) */
        #badge {
            position: absolute;
            right: 0%;
            top: 0%;
            z-index: 10;
            padding: 2px 8px;
            border-radius: 100px;
            background: var(--offlinecolor);
            color: #FFFFFF;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }

        #state {
            font-size: var(--statefont);
        }

        #statetext {
            color: var(--statecolor);
        }

        #action {
            font-size: var(--actionfont);
        }

        #progressbar {
            font-size: var(--progressfont);
        }

        /* 4 Zeilen mit festen Höhen (prozentual) */
        .row1,
        .row2 {
            height: 30%;
        }

        .row3 {
            height: 25%;
        }

        .row1,
        .row2,
        .row3 {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .row4 {
            height: 15%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            line-height: 1;
            white-space: nowrap;
            gap: 5px;
        }

        .row4 .col {
            flex: 1 1 0;
            display: flex;
            flex-direction: row;
        }

        /* individuelle Ausrichtung der Spalteninhalte */
        .row4 .col:nth-child(1) {
            justify-content: flex-start;
            /* links */
        }

        .row4 .col:nth-child(2) {
            justify-content: center;
            /* mittig */
        }

        .row4 .col:nth-child(3) {
            justify-content: flex-end;
            /* rechts */
        }

        /* Überschrift (optional) */
        .head {
            font-size: calc(1em - 4px);
            text-transform: uppercase;
            line-height: 1.2;
            filter: brightness(0.6);
        }

        /* Text */
        .text {
            line-height: 1.4;
        }

        /* Progressbar */
        .bar {
            height: 100%;
            position: relative;
            border-radius: 8px;
            background: linear-gradient(to right, rgba(135, 135, 135, 0.6) 0%, rgba(135, 135, 135, 0.2) 100%);
            overflow: hidden;
        }

        .bar .progress {
            height: 100%;
            width: var(--progressvalue);
            border-radius: 8px 0 0 8px;
            background: repeating-linear-gradient(to right, var(--progressstart) 0%, var(--progressstop) 50%, var(--progressstart) 100%);
            background-size: 200% auto;
            animation: gradient-progress 10s infinite;
            transition: width 2s;
            white-space: nowrap;
        }

        .bar .label {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: var(--progressfont);
            white-space: nowrap;
        }

        .bar .label.left {
            left: 10px;
        }

        .bar .label.right {
            right: 10px;
        }

        @keyframes gradient-progress {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        /* Infobereich */
        #info1 {
            font-size: var(--info1font);
        }

        #info2 {
            font-size: var(--info2font);
        }

        #info3 {
            font-size: var(--info3font);
        }

        .icon {
            color: var(--content-color);
        }

        .icon:not(:empty) {
            margin-right: 4px;
        }

        /* Schalter Checkbox  */
        .lbl {
            position: relative;
            display: block;
            height: 14px;
            width: 32px;
            background: rgba(96, 125, 139, 0.5);
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lbl:after {
            position: absolute;
            left: -2px;
            top: -2px;
            display: block;
            width: 18px;
            height: 18px;
            border-radius: 100px;
            background: rgba(96, 125, 139, 1.0);
            box-shadow: 0px 3px 3px rgba(0, 0, 0, 0.05);
            content: '';
            transition: all 0.3s ease;
        }

        .lbl:active:after {
            transform: scale(1.15, 0.85);
        }

        .cbx {
            display: none;
        }

        .cbx:checked~label {
            background: color-mix(in srgb, var(--accent-color), transparent 50%);
        }

        .cbx:checked~label:after {
            left: 18px;
            background: color-mix(in srgb, var(--accent-color), transparent 0%);
        }
    </style>
    <script src="/icons.js" crossorigin="anonymous"></script>
</head>

<body>
    <div id="container" class="ratio-40">
        <div id="left">
            <img id="imageon" alt="Device State Image (ON)" style="display: none;">
            <img id="imageoff" alt="Device State Image (OFF)" style="display: none;">
        </div>
        <div id="right">
            <!-- Oben/Rechts: Schalter -->
            <div id="switch">
                <input type="checkbox" id="toggle" class="cbx" />
                <label for="toggle" class="lbl"></label>
            </div>
            <!-- Oben/Rechts: Offline-Badge (anstelle des Schalters) -->
            <div id="badge" style="display: none;">OFFLINE</div>
            <!-- Zeile 1: State -->
            <div id="state" class="row1">
                <div id="statehead" class="head"></div>
                <div id="statetext" class="text"></div>
            </div>
            <!-- Zeile 2: Action -->
            <div id="action" class="row2">
                <div id="actionhead" class="head"></div>
                <div id="actiontext" class="text"></div>
            </div>
            <!-- Zeile 3: Progress -->
            <div class="row3">
                <div id="progresshead" class="head"></div>
                <div id="progressbar" class="bar">
                    <span id="progressleft" class="label left"></span>
                    <span id="progressright" class="label right"></span>
                    <div class="progress"></div>
                </div>
            </div>
            <!-- Zeile 4: Info -->
            <div class="row4">
                <div id="info1" class="col">
                    <span id="info1icon" class="icon"></span>
                    <span id="info1text"></span>
                </div>
                <div id="info2" class="col">
                    <span id="info2icon" class="icon"></span>
                    <span id="info2text"></span>
                </div>
                <div id="info3" class="col">
                    <span id="info3icon" class="icon"></span>
                    <span id="info3text"></span>
                </div>
            </div>
        </div>
    </div>
    <script>
        // ── INIT: set root/style variables ───────────────────────────────────
        const p = new URLSearchParams(location.search);
        const root = document.documentElement;
        const m = {
            margintop: ['--margin-top'],
            marginside: ['--margin-side'],
            marginbottom: ['--margin-bottom']
        };
        for (const k in m) {
            const v = p.get(k);
            if (!v) continue;
            root.style.setProperty(m[k], `${v}px`);
        }

        // ── ELEMENTS: ────────────────────────────────────────────────────────
        const elContainer = document.getElementById('container');
        const elImageOn = document.getElementById('imageon');
        const elImageOff = document.getElementById('imageoff');
        const elSwitch = document.getElementById('switch');
        const elToggle = document.getElementById('toggle');
        const elBadge = document.getElementById('badge');
        const elStateHead = document.getElementById('statehead');
        const elStateText = document.getElementById('statetext');
        const elActionHead = document.getElementById('actionhead');
        const elActionText = document.getElementById('actiontext');
        const elProgressHead = document.getElementById('progresshead');
        const elProgressLeft = document.getElementById('progressleft');
        const elProgressRight = document.getElementById('progressright');

        // ── STATE: ───────────────────────────────────────────────────────────
        // progress bar visible for the current status (default: true)
        let statebar = true;
        // last received progress data, needed to redraw on status changes
        const progress = { text: null, value: null, min: 0, max: 100, term: null };
        // status value => {image, color, progress}, image currently to be shown ('ON' or 'OFF')
        let statemap = {};
        let stateimage = 'OFF';
        // switch available (variable with action) and device availability
        let switchable = false;
        let offline = false;

        // ── FUNCTION: show switch or offline badge (badge replaces switch) ───
        function showSwitch() {
            elSwitch.style.display = (switchable && !offline) ? '' : 'none';
            elBadge.style.display = offline ? '' : 'none';
        }

        // ── FUNCTION: set or remove the source of a status image ─────────────
        function setImage(img, data) {
            if (data) {
                img.src = data;
            } else {
                img.removeAttribute('src');
            }
            showImage();
        }

        // ── FUNCTION: toggle visibility of the status images ─────────────────
        // Both images are decoded only once, a status change only toggles the visibility
        function showImage() {
            elImageOn.style.display = (stateimage === 'ON' && elImageOn.hasAttribute('src')) ? '' : 'none';
            elImageOff.style.display = (stateimage !== 'ON' && elImageOff.hasAttribute('src')) ? '' : 'none';
        }

        // ── FUNCTION: calculate progress percentage from value and range ─────
        function getPercentage(val, min, max) {
            if (isNaN(val) || isNaN(min) || isNaN(max) || max <= min) {
                return 0;
            }
            let percentage;
            if (min > 0 && Number.isInteger(min) && Number.isInteger(max) && Number.isInteger(val)) {
                // discrete steps (e.g. 1..6): first step already fills 1/n
                percentage = (val - min + 1) / (max - min + 1) * 100;
            } else {
                // continuous range (also 0..n): min = 0 %, max = 100 %
                percentage = (val - min) / (max - min) * 100;
            }
            return Math.min(100, Math.max(0, percentage));
        }

        // ── FUNCTION: draw progress bar from the last received data ──────────
        function renderProgress() {
            if (statebar === false) {
                elProgressLeft.textContent = '0%';
                elProgressRight.textContent = '0 min';
                root.style.setProperty('--progressvalue', '0%');
                return;
            }
            if (progress.text !== null) {
                elProgressLeft.textContent = progress.text;
            }
            if (progress.term !== null && progress.term !== undefined) {
                elProgressRight.textContent = Math.round(progress.term / 60) + ' min';
            }
            if (progress.value !== null) {
                const percentage = getPercentage(progress.value, progress.min, progress.max);
                root.style.setProperty('--progressvalue', percentage + '%');
            }
        }

        // ── ICON: FontAwesome icon mapping ──────────────────────────────────
        function getIconType(iconName) {
            if (!iconName || iconName === 'Transparent') {
                return { type: 'none', classes: '' };
            }
            const raw = String(iconName).trim();
            const iconMapping = window.iconMapping || {};
            const mapped = iconMapping[raw] ?? raw;
            const iconClass = String(mapped).trim();
            const tokens = iconClass.split(/\s+/).filter(Boolean);
            // 1) Is there an explicit prefix in the string?
            if (tokens.some(t => t === 'fak' || t === 'fa-kit')) {
                return { type: 'kit', classes: (tokens.includes('fa-fw') ? '' : 'fa-fw ') + iconClass };
            }
            if (tokens.some(t => t === 'fa-light' || t === 'fal')) {
                return { type: 'fa-light', classes: (tokens.includes('fa-fw') ? '' : 'fa-fw ') + iconClass };
            }
            // 2) No prefix → FA-API: Does it exist as “fal”?
            const baseName = iconClass.startsWith('fa-') ? iconClass.substring(3) : iconClass;
            try {
                if (window.FontAwesome && typeof window.FontAwesome.findIconDefinition === 'function') {
                    if (window.FontAwesome.findIconDefinition({ prefix: 'fal', iconName: baseName })) {
                        return { type: 'fa-light', classes: `fa-fw fa-light fa-${baseName}` };
                    }
                }
            } catch (e) {}
            // 3) Not in fal → Kit icon
            return { type: 'kit', classes: `fa-fw fa-kit fak fa-${baseName}` };
        }

        // ── FUNCTION: set info symbol (Symcon icon or legacy character/emoji) ─
        function setInfoIcon(elIcon, value) {
            elIcon.replaceChildren();
            const name = String(value ?? '').trim();
            if (name === '' || name === 'Transparent') {
                return;
            }
            // icon names are plain ASCII identifiers, anything else (e.g. emoji) is shown as text
            if (!/^[A-Za-z0-9-]+$/.test(name)) {
                elIcon.textContent = name;
                return;
            }
            const icon = document.createElement('i');
            icon.className = getIconType(name).classes;
            elIcon.appendChild(icon);
        }

        // ── FUNCTION: handle infoN parameters (font, icon, text) ─────────────
        function handleInfoParameter(parameter, value) {
            const match = parameter.match(/^info(\d+)(font|icon|text)$/);
            // not an infoN parameter -> continue in switch
            if (!match) return false;

            const index = match[1]; // "1", "2", "3" ...
            const type = match[2]; // "font", "icon", "text"

            switch (type) {
                case 'font':
                    root.style.setProperty(`--info${index}font`, value + 'px');
                    break;
                case 'icon':
                    setInfoIcon(document.getElementById(`info${index}icon`), value);
                    break;
                case 'text':
                    document.getElementById(`info${index}text`).textContent = value;
                    break;
            }
            return true;
        }

        // ── EVENT: switch toggled -> send action to module ───────────────────
        elToggle.addEventListener('change', function () {
            requestAction('SwitchState', this.checked ? true : false);
        });

        // ── SDK: handleMessage (data transfer) ───────────────────────────────
        function handleMessage(data) {
            const decodedData = JSON.parse(data);
            for (const parameter in decodedData) {
                switch (parameter) {
                    case 'tilecolor':
                        if (decodedData[parameter]) {
                            root.style.setProperty('--tilecolor', decodedData[parameter]);
                        }
                        break;
                    case 'tiletrans':
                        root.style.setProperty('--tiletrans', decodedData[parameter] + '%');
                        break;
                    case 'tileratio':
                        if (decodedData[parameter] !== 0) {
                            elContainer.className = 'ratio-' + decodedData[parameter];
                        }
                        break;
                    case 'offlinecolor':
                        if (decodedData[parameter]) {
                            root.style.setProperty('--offlinecolor', decodedData[parameter]);
                        }
                        break;
                    case 'offline':
                        offline = decodedData[parameter] === true;
                        showSwitch();
                        break;
                    case 'switchstate':
                        switchable = !!decodedData[parameter];
                        if (switchable) {
                            elToggle.checked = decodedData[parameter] === 'on';
                        }
                        showSwitch();
                        break;
                    case 'statefont':
                        root.style.setProperty('--statefont', decodedData[parameter] + 'px');
                        break;
                    case 'statehead':
                        elStateHead.textContent = decodedData[parameter];
                        break;
                    case 'statetext':
                        elStateText.textContent = decodedData[parameter];
                        break;
                    case 'imageon':
                        setImage(elImageOn, decodedData[parameter]);
                        break;
                    case 'imageoff':
                        setImage(elImageOff, decodedData[parameter]);
                        break;
                    case 'statemap':
                        statemap = decodedData[parameter] || {};
                        break;
                    case 'statevalue': {
                        const index = decodedData[parameter];
                        // unknown values fall back to the first entry (value 0)
                        const entry = statemap[index] || statemap[0] || null;
                        if (Object.keys(statemap).length === 0) {
                            statebar = true;
                        } else {
                            statebar = entry ? entry.progress !== false : false;
                        }
                        stateimage = entry ? entry.image : 'OFF';
                        showImage();
                        if (entry && entry.color) {
                            root.style.setProperty('--statecolor', entry.color);
                        } else {
                            root.style.removeProperty('--statecolor');
                        }
                        renderProgress();
                        break;
                    }
                    case 'actionfont':
                        root.style.setProperty('--actionfont', decodedData[parameter] + 'px');
                        break;
                    case 'actionhead':
                        elActionHead.textContent = decodedData[parameter];
                        break;
                    case 'actiontext':
                        elActionText.textContent = decodedData[parameter];
                        break;
                    case 'progressfont':
                        root.style.setProperty('--progressfont', decodedData[parameter] + 'px');
                        break;
                    case 'progresshead':
                        elProgressHead.textContent = decodedData[parameter];
                        break;
                    case 'progresstext':
                        progress.text = decodedData[parameter];
                        renderProgress();
                        break;
                    case 'progressmin':
                        progress.min = parseFloat(decodedData[parameter]);
                        break;
                    case 'progressmax':
                        progress.max = parseFloat(decodedData[parameter]);
                        break;
                    case 'progressvalue':
                        progress.value = parseFloat(decodedData[parameter]);
                        renderProgress();
                        break;
                    case 'progressstart':
                        root.style.setProperty('--progressstart', decodedData[parameter]);
                        break;
                    case 'progressstop':
                        root.style.setProperty('--progressstop', decodedData[parameter]);
                        break;
                    case 'progressterm':
                        progress.term = decodedData[parameter];
                        renderProgress();
                        break;
                    default:
                        if (!handleInfoParameter(parameter, decodedData[parameter])) {
                            console.warn('Unknown parameter:', parameter);
                        }
                        break;
                }
            }
        }
    </script>
</body>

</html>
